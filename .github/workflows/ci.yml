name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The clean fixtures must stay clean — this is the regression that matters.
      - name: good fixtures lint clean
        run: node dist/cli.js check test/fixtures/good

      # And the bad ones must keep failing, or a rule silently stopped working.
      - name: bad fixtures still fail
        run: |
          if node dist/cli.js check test/fixtures/bad; then
            echo "::error::test/fixtures/bad linted clean — a rule regressed"
            exit 1
          fi

      - name: SARIF is well-formed
        run: |
          # `check` on the bad fixtures exits 1 by design — that is the whole
          # point of those fixtures — and this step runs under `bash -e`, so the
          # exit code has to be tolerated or the step dies before validating.
          node dist/cli.js check test/fixtures/bad --format sarif > graphlint.sarif || true
          # Read and parse explicitly: `require()` cannot load a `.sarif` file,
          # because Node only resolves .js, .json and .node extensions.
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const s = JSON.parse(readFileSync('graphlint.sarif', 'utf8'));
            if (s.version !== '2.1.0') throw new Error('bad sarif version: ' + s.version);
            const run = s.runs?.[0];
            if (!run) throw new Error('sarif has no runs');
            if (!run.results?.length) throw new Error('sarif has no results');
            const declared = new Set(run.tool.driver.rules.map((r) => r.id));
            for (const res of run.results) {
              if (!declared.has(res.ruleId)) throw new Error('result cites undeclared rule ' + res.ruleId);
              const region = res.locations[0].physicalLocation.region;
              if (!(region.startLine > 0)) throw new Error('result has no line for ' + res.ruleId);
            }
            console.log('ok  sarif 2.1.0,', run.results.length, 'results,', declared.size, 'rules declared');
          "

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: graphlint.sarif
          category: graphlint
